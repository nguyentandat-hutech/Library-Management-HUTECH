<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sách Mới - Quản lý Thư viện HUTECH</title>
    <link rel="stylesheet" href="../../style-common.css">
    <link rel="stylesheet" href="add.css">
</head>

<body>
    <header>
        <h1>HỆ THỐNG QUẢN LÝ THƯ VIỆN</h1>
        <nav>
            <ul>
                <li><a href="../../index.html">Trang chủ</a></li>
                <li><a href="../list/list.html">Danh sách sách</a></li>
                <li><a href="../add/add.html" class="active">Thêm sách mới</a></li>
                <li><a href="../edit/edit.html">Sửa thông tin</a></li>
                <li><a href="../delete/delete.html">Xóa sách</a></li>
                <li><a href="../search/search.html">Tìm kiếm</a></li>
                <li><a href="../contact/contact.html">Liên hệ nhóm</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Thêm Sách Mới Vào Thư Viện</h2>
            <p class="description">Vui lòng điền đầy đủ thông tin sách cần thêm vào hệ thống</p>

            <form id="add-book-form">
                <div class="form-group">
                    <label for="book-id">Mã sách:</label>
                    <input type="number" id="book-id" name="book-id" placeholder="Nhập mã sách (VD: 109)" required
                        min="1">
                </div>

                <div class="form-group">
                    <label for="book-title">Tên sách:</label>
                    <input type="text" id="book-title" name="book-title"
                        placeholder="Nhập tên sách (VD: Lập trình Windows)" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="book-author">Tác giả:</label>
                    <input type="text" id="book-author" name="book-author" placeholder="Nhập tên tác giả (VD: HUTECH)"
                        required maxlength="50">
                </div>

                <div class="form-group">
                    <label for="book-category">Thể loại:</label>
                    <select id="book-category" name="book-category" required>
                        <option value="">-- Chọn thể loại --</option>
                        <option value="CNTT">CNTT</option>
                        <option value="Giáo dục">Giáo dục</option>
                        <option value="Lập trình">Lập trình</option>
                        <option value="Bảo mật">Bảo mật</option>
                        <option value="Thiết kế">Thiết kế</option>
                        <option value="Di động">Di động</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="book-status">Trạng thái:</label>
                    <select id="book-status" name="book-status" required>
                        <option value="">-- Chọn trạng thái --</option>
                        <option value="Còn sách">Còn sách</option>
                        <option value="Đã mượn">Đã mượn</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Thêm sách</button>
                    <button type="reset" class="btn btn-secondary">Làm mới</button>
                    <a href="../../index.html" class="btn btn-cancel">Quay lại</a>
                </div>
            </form>

            <div id="message-box" class="message-box hidden"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Nhóm 7 - Lập trình môi trường Windows - HUTECH</p>
    </footer>

    <script src="../../data.js"></script>
    <script src="add.js"></script>
</body>

</html>
